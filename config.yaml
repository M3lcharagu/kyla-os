project:
  name: KYLA
  owner: Mel
  version: "0.1.0"

runtime:
  default_room: R1
  default_agent: shell
  dry_run: true
  timeout_seconds: 90
  allowed_docker_images: []

rooms:
  R1:
    name: HUMANITAS Command Center
    purpose: Main command router
    aliases: [humanitas, command center, commands, main]
    default_agent: shell

  R2:
    name: PATIENTIA Second Brain
    purpose: Notes, memory, and personal knowledge
    aliases: [patientia, second brain, notes, memory]
    default_agent: claude

  R3:
    name: TEMPERANTIA Trading Room
    purpose: Trading research and journaling
    aliases: [temperantia, trading, markets, investing]
    default_agent: shell

  R4:
    name: INDUSTRIA Dev Lab
    purpose: Software development
    aliases: [industria, dev lab, coding, code, programming]
    default_agent: codex

  R5:
    name: LUXURIA Creative Studio
    purpose: Creative ideation and writing
    aliases: [luxuria, creative studio, writing, ideas]
    default_agent: claude

  R6:
    name: GULA Editing Suite
    purpose: Video and audio editing workflows
    aliases: [gula, editing suite, video editing, audio editing]
    default_agent: droid

  R7:
    name: SUPERBIA Broadcast Room
    purpose: Publishing and broadcasting
    aliases: [superbia, broadcast, publishing, content]
    default_agent: copilot

  R8:
    name: INVIDIA Photo Studio
    purpose: Image and photography workflows
    aliases: [invidia, photo studio, photography, images]
    default_agent: droid

  R9:
    name: CARITAS Client Lounge
    purpose: Client communication and delivery
    aliases: [caritas, client lounge, clients, client]
    default_agent: claude

  R10:
    name: HUMILITAS Study Room
    purpose: School and learning
    aliases: [humilitas, study room, study, school, learning]
    default_agent: copilot

  R11:
    name: AVARITIA Business Ops
    purpose: Business administration
    aliases: [avaritia, business ops, business, operations]
    default_agent: shell

  R12:
    name: ACEDIA Research
    purpose: General research
    aliases: [acedia, research, investigate, sources]
    default_agent: claude

  R13:
    name: IRA QA & Security
    purpose: Testing and security
    aliases: [ira, qa, testing, security, audit]
    default_agent: docker-agent

  R14:
    name: CASTITAS Life OS
    purpose: Personal life management
    aliases: [castitas, life os, life, habits, calendar]
    default_agent: shell

agents:
  claude:
    mode: external
    command: null

  codex:
    mode: external
    command: null

  copilot:
    mode: external
    command: null

  cursor:
    mode: external
    command: null

  docker-agent:
    mode: docker
    command: null

  droid:
    mode: external
    command: null

  shell:
    mode: local
    command: null
