project:
  name: KYLA
  owner: Mel
  version: "0.1.0"

runtime:
  default_room: R1
  # Local-first: Ollama uses zero cloud credits. Cloud agents stay command:null.
  default_agent: ruflo
  dry_run: true
  # Clips need longer than chat; agents can still finish faster.
  timeout_seconds: 600
  prefer_local: true
  allowed_docker_images: []

rooms:
  R1:
    name: HUMANITAS Command Center
    purpose: Main command router
    aliases: [humanitas, command center, commands, main, agency-agents, agency agents, ruflo, ruflow, swarm, hive, claude-flow, harness, awesome-harness]
    default_agent: ruflo
    suite: command

  R2:
    name: PATIENTIA Second Brain
    purpose: Notes, memory, and personal knowledge
    aliases: [patientia, second brain, notes, memory, prompts, prompts.chat, awesome prompts, chatgpt prompts]
    default_agent: stack
    suite: memory

  R3:
    name: TEMPERANTIA Trading Room
    purpose: Trading research and journaling
    aliases: [temperantia, trading, markets, investing]
    default_agent: shell

  R4:
    name: INDUSTRIA Dev Lab
    purpose: Software development
    aliases: [industria, dev lab, coding, code, programming, openhands, open hands, context7, graft, codebase-memory, codebase memory, cli-anything, cli anything, gitingest, git digest, git ingest, ruflo, ruflow, swarm, hive]
    default_agent: ruflo
    suite: code

  R5:
    name: LUXURIA Creative Studio
    purpose: Creative ideation and writing
    aliases: [luxuria, creative studio, writing, ideas, mumuainovel, mumu ai novel, ai novel, design-md, awesome-design-md, awesome design md, design.md]
    default_agent: stack
    suite: write

  R6:
    name: GULA Editing Suite
    purpose: Video and audio editing workflows
    aliases: [gula, editing suite, video editing, audio editing, capcut, clip, shorts, openmontage, open montage, remotion, voicebox, personalive, persona live]
    default_agent: clip
    suite: video

  R7:
    name: SUPERBIA Broadcast Room
    purpose: Publishing and broadcasting
    aliases: [superbia, broadcast, publishing, content, remotion, voicebox, openmontage]
    default_agent: stack
    suite: video

  R8:
    name: INVIDIA Photo Studio
    purpose: Image and photography workflows
    aliases: [invidia, photo studio, photography, images, design system, design-md, awesome-design-md]
    default_agent: stack
    suite: design

  R9:
    name: CARITAS Client Lounge
    purpose: Client communication and delivery
    aliases: [caritas, client lounge, clients, client]
    default_agent: ollama

  R10:
    name: HUMILITAS Study Room
    purpose: School and learning
    aliases: [humilitas, study room, study, school, learning, build-your-own-x, build your own, byox, codecrafters]
    default_agent: stack
    suite: study

  R11:
    name: AVARITIA Business Ops
    purpose: Business administration
    aliases: [avaritia, business ops, business, operations, market skills, marketingskills, corey haines, corey haynes, freedomain, free domain, digitalplat]
    default_agent: stack
    suite: business

  R12:
    name: ACEDIA Research
    purpose: General research
    aliases: [acedia, research, investigate, sources, context7, gitingest, agent-reach, agent reach, public-apis, public apis, openviking]
    default_agent: stack
    suite: research

  R13:
    name: IRA QA & Security
    purpose: Testing and security
    aliases: [ira, qa, testing, security, audit, cyber skills, cybersecurity skills, anthropic-cybersecurity-skills]
    default_agent: stack

  R14:
    name: CASTITAS Life OS
    purpose: Personal life management
    aliases: [castitas, life os, life, habits, calendar]
    default_agent: shell

agents:
  # Cloud / external labels — left null so daily use burns ZERO paid credits.
  claude:
    mode: external
    command: null

  codex:
    mode: external
    command: null

  copilot:
    mode: external
    command: null

  cursor:
    mode: external
    command: null

  docker-agent:
    mode: docker
    command: null

  droid:
    mode: external
    command: null

  shell:
    mode: local
    command: null

  # Local free path (Ollama HTTP — no cloud)
  ollama:
    mode: local
    command: "python tools/ollama_agent.py"

  # CapCut-style local clipper (yt-dlp + whisper + ffmpeg)
  clip:
    mode: local
    command: "python tools/clip_agent.py"

  capcut:
    mode: local
    command: "python tools/clip_agent.py"

  # First-class operating stack (lazy bootstrap, Ollama LLM, $0)
  stack:
    mode: local
    command: "python tools/stack_agent.py --suite command"


  # ALWAYS-ON orchestrator (Ruflo / ruflow / claude-flow). Falls back to stack if Node missing.
  ruflo:
    mode: local
    command: "python tools/ruflo_agent.py"

  ruflow:
    mode: local
    command: "python tools/ruflo_agent.py"

  swarm:
    mode: local
    command: "python tools/ruflo_agent.py --mode swarm"

  hive:
    mode: local
    command: "python tools/ruflo_agent.py --mode hive"

  agent-reach:
    mode: local
    command: "python tools/agent_reach_cli.py"

  catalog:
    mode: local
    command: "python tools/integrations_cli.py dispatch"
