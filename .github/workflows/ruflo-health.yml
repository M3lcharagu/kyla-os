name: Ruflo Health

# SCHEDULED 24/7 — zero Melvin. Ruflo wiring smoke; no paid keys.
on:
  schedule:
    - cron: '30 6 * * *'  # 09:30 EAT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kyla-briefs-main
  cancel-in-progress: false

jobs:
  ruflo-health:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ruflo version / doctor (no paid keys)
        env:
          CI: '1'
          npm_config_yes: 'true'
          KYLA_STACK_DIR: ${{ github.workspace }}/kyla-stack
        run: |
          set -euo pipefail
          mkdir -p kyla/briefs "$KYLA_STACK_DIR/ruflo"
          stamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          out="kyla/briefs/ruflo-health-$(date -u +'%Y-%m-%d').md"
          {
            echo "# Ruflo Health — ${stamp}"
            echo
            echo "## Policy"
            echo "- KYLA runtime.default_agent must be **ruflo** (always-on)."
            echo "- This job never sets Anthropic/OpenAI keys."
            echo
            echo "## node / npx"
            echo '```'
            node -v
            npx -v
            echo '```'
            echo
            echo "## npx ruflo@latest --version"
            echo '```'
            npx --yes ruflo@latest --version || echo "(version exit $?)"
            echo '```'
            echo
            echo "## KYLA dry-run routes to ruflo"
            echo '```'
            python main.py --dry-run "plan my week in humanitas" || true
            python main.py --dry-run "clip a youtube short in gula" || true
            echo '```'
            echo
            echo "## 24/7 notes"
            echo "- Scheduled Actions need zero Melvin. Interactive bots need online_bridge host."
            echo "- See docs/ONLINE.md."
          } | tee "$out"

      - name: Job summary
        run: |
          f="kyla/briefs/ruflo-health-$(date -u +'%Y-%m-%d').md"
          { echo "### Ruflo health"; echo; [[ -f "$f" ]] && sed -n '1,120p' "$f"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit with rebase retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kyla/briefs/ || true
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "chore: ruflo health digest"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then echo "Pushed attempt $i"; exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 0; }
            sleep $((i * 2))
          done
          echo "Push retries exhausted — non-fatal"
