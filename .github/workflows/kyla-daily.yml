name: KYLA Daily News Brief

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: kyla
        run: npm install

      - name: Generate daily brief
        working-directory: kyla
        run: |
          set -euo pipefail
          brief_date="$(date -u +'%Y-%m-%d')"
          mkdir -p briefs
          {
            printf '# KYLA Daily Brief - %s\n\n' "$brief_date"
            node kyla-news.js
          } > "briefs/${brief_date}.md"

      - name: Commit and push daily brief
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kyla/briefs/
          if git diff --cached --quiet; then
            echo "No daily brief changes to commit."
          else
            git commit -m "chore: update KYLA daily brief"
            git push origin HEAD:main
          fi
