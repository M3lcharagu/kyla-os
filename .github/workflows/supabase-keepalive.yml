name: Supabase Keep-Alive

# Free Supabase projects pause after ~1 week without activity.
# A cheap REST select twice a week keeps it awake (the daily brief writes help too).
# Skips cleanly when the SUPABASE_* secrets are not set yet. No paid APIs.
on:
  schedule:
    - cron: '17 5 * * 1,4'  # Mon + Thu 08:17 EAT
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Ping Supabase REST (skipped if secrets are missing)
        shell: bash
        run: |
          set -uo pipefail
          if [[ -z "${SUPABASE_URL}" || -z "${SUPABASE_SERVICE_ROLE_KEY}" ]]; then
            echo "Supabase secrets not set — skipping (nothing to keep alive yet)."
            echo "### Supabase keep-alive: skipped (no SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY secrets)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          hdr=(-H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}")
          # Legacy service_role keys are JWTs (eyJ...) and also go in Authorization.
          # New sb_secret_ keys must only be sent as apikey.
          if [[ "${SUPABASE_SERVICE_ROLE_KEY}" == eyJ* ]]; then
            hdr+=(-H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "${hdr[@]}" \
            "${SUPABASE_URL%/}/rest/v1/news_briefs?select=id&limit=1" || echo 000)
          echo "Supabase ping HTTP ${code}"
          echo "### Supabase keep-alive: HTTP ${code}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${code}" != 2* ]]; then
            echo "::warning::Supabase ping returned HTTP ${code}. If the project is paused, restore it from the Supabase dashboard."
          fi
          exit 0
